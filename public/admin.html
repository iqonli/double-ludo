<body>
  <main class="wrap">
    <header class="topbar">
      <div>
        <h1 id="adminTitle">双飞 v__APP_VERSION__ 服务端管理</h1>
        <div id="adminSubtitle" class="muted">登录码自动绑定房间，客户端无需输入房间号。</div>
      </div>
      <div class="top-actions">
        <button id="createRoom" class="primary">新建房间</button>
        <button id="aboutButton">关于</button>
        <a id="gameLink" class="button game-link" target="_blank" rel="noopener">游戏端</a>
      </div>
    </header>

    <div class="dashboard">
      <aside class="side-column">
        <section id="chatCard" class="card chat-card">
          <div class="chat-heading"><h2 id="chatTitle">局域网聊天</h2><span id="chatCount">0</span></div>
          <select id="chatRoomSelect" class="chat-room-select" aria-label="选择聊天房间"></select>
          <div class="chat-log-wrap"><div id="chatLog" class="chat-log" role="log" aria-live="polite"></div><button id="chatUnread" class="chat-unread hidden">未读 0</button></div>
          <textarea id="chatInput" maxlength="2000" placeholder=""></textarea>
          <div class="chat-actions"><button id="chatHint" class="chat-mode-button">当前：Enter发送</button><button id="sendChat" class="primary">发送</button></div>
          <div id="notice" class="notice" role="status" aria-live="polite"></div>
          <div id="chatResizeHandle" class="chat-resize-handle" aria-label="拖动调整聊天高度"></div>
        </section>

        <section id="accountsCard" class="card hidden">
          <div class="section-head"><h2>账号管理</h2><span id="accountCount" class="muted">0</span></div>
          <div id="accounts" class="accounts-list"></div>
        </section>

        <section id="onlinePlayersCard" class="card hidden">
          <div class="section-head"><h2>在线玩家IP列表</h2><span id="onlinePlayerAdminCount" class="muted">0</span></div>
          <div id="onlinePlayers" class="online-players-list"></div>
        </section>
      </aside>

      <section id="roomsGrid" class="rooms-grid"></section>
      <section class="card console-card"><h2>服务端控制台</h2><pre id="consoleLog" class="console-log"></pre></section>
    </div>

    <input id="importFile" type="file" accept="application/json,.json" class="hidden">
    <div id="copyPop" class="copy-pop hidden" role="status">复制成功</div>
  </main>

  <div id="aboutModal" class="admin-modal hidden">
    <section class="admin-modal-card">
      <h2>关于</h2>
      <div id="aboutContent"></div>
      <div class="admin-modal-actions"><button id="closeAboutButton">关闭</button></div>
    </section>
  </div>

  <script src="/request-retry.js"></script>
  <script src="/admin.js"></script>
</body>
</html>
